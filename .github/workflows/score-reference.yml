name: Score reference
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: score-reference
  cancel-in-progress: false
jobs:
  reference:
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm score:reference:build
      - name: Compute, verify and promote reference then VACUUM
        env:
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --frozen python -m ingest.score_reference --target remote
      - name: Keep reference outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/score-reference/**/report.json
          if-no-files-found: ignore
          retention-days: 30
