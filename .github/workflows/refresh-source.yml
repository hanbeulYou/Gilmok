name: Refresh one source
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      end_month:
        type: string
        default: ''
      quarter:
        type: string
        default: ''
      asset_manifest_key:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: refresh-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.15
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Collect, verify, commit, then VACUUM separately
        env:
          REFRESH_SOURCE: ${{ inputs.source }}
          END_MONTH: ${{ inputs.end_month }}
          QUARTER: ${{ inputs.quarter }}
          ASSET_MANIFEST_KEY: ${{ inputs.asset_manifest_key }}
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_SERVICE_URL: ${{ vars.VWORLD_SERVICE_URL }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          args=(--source "$REFRESH_SOURCE" --target remote)
          [[ -z "$END_MONTH" ]] || args+=(--end-month "$END_MONTH")
          [[ -z "$QUARTER" ]] || args+=(--quarter "$QUARTER")
          [[ -z "$ASSET_MANIFEST_KEY" ]] || args+=(--asset-manifest-key "$ASSET_MANIFEST_KEY")
          uv run --frozen python -m ingest.refresh "${args[@]}"
      - name: Keep refresh outcome (no raw records or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/refresh/**/report.json
          if-no-files-found: ignore
          retention-days: 30
