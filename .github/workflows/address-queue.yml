name: Address queue
on:
  repository_dispatch:
    types: [gilmok_address_pending]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 'Read-only fixed public address provider diagnosis (no DB/queue)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: address-queue
  cancel-in-progress: false
jobs:
  drain:
    if: vars.INGEST_REMOTE_ENABLED == 'true' && inputs.diagnose_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.15
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Drain pending queue (bounded; no address logs)
        env:
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          JUSO_COORD_API_KEY: ${{ secrets.JUSO_COORD_API_KEY }}
          JUSO_COORD_ENABLED: ${{ vars.JUSO_COORD_ENABLED == 'true' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --frozen python -m ingest.address_dispatch --target remote --max-requests 10
      - name: Reconcile status projections and report unresolved errors
        if: ${{ always() && !cancelled() }}
        env:
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run --frozen python -m ingest.reconcile_projection --target remote

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.15
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Diagnose providers without queue or DB access
        env:
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: uv run --frozen python -m ingest.address_provider_diagnostic
