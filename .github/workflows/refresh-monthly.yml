name: Monthly source refresh
on:
  schedule:
    # 03:17 KST on the 10th = 18:17 UTC on the 9th.
    - cron: '17 18 9 * *'
  workflow_dispatch:
    inputs:
      source:
        description: Sources to publish atomically with a new score reference
        type: choice
        options: [all, living, transit, academies, schools, population, trades]
        default: all
      end_month:
        description: Completed end month YYYY-MM; empty uses last completed month
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: refresh-monthly
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm score:reference:build
      - name: Prepare all sources, then commit sources and reference together
        env:
          REFRESH_SOURCE: ${{ inputs.source || 'all' }}
          END_MONTH: ${{ inputs.end_month || '' }}
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          JUSO_COORD_API_KEY: ${{ secrets.JUSO_COORD_API_KEY }}
          JUSO_COORD_ENABLED: ${{ vars.JUSO_COORD_ENABLED == 'true' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          args=(--source "$REFRESH_SOURCE" --target remote)
          [[ -z "$END_MONTH" ]] || args+=(--end-month "$END_MONTH")
          uv run --frozen python -m ingest.refresh_monthly "${args[@]}"
      - name: Keep atomic refresh outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/monthly/**/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  warmup:
    needs: refresh
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Warm six RPC cases after atomic release commits
        env:
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run --frozen python -m ingest.warm_score_inputs
