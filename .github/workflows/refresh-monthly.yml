name: Monthly source refresh
on:
  schedule:
    # 03:17 KST on the 10th = 18:17 UTC on the 9th.
    - cron: '17 18 9 * *'
  workflow_dispatch:
    inputs:
      source:
        description: Select one failed source for retry, or all
        type: choice
        options: [all, living, transit, academies, schools, population, trades]
        default: all
      end_month:
        description: Completed end month YYYY-MM; empty selects last completed month
        required: false
        type: string
permissions:
  contents: read
jobs:
  refresh:
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: ${{ fromJSON(inputs.source && inputs.source != 'all' && format('["{0}"]', inputs.source) || '["living","transit","academies","schools","population","trades"]') }}
    uses: ./.github/workflows/refresh-source.yml
    with:
      source: ${{ matrix.source }}
      end_month: ${{ inputs.end_month || '' }}
    secrets: inherit
  reference:
    needs: refresh
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    uses: ./.github/workflows/score-reference.yml
    secrets: inherit
  warmup:
    needs: reference
    if: vars.INGEST_REMOTE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ingest-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.15
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Warm six RPC cases after all refresh and reference commits
        env:
          INGEST_REMOTE_ENABLED: 'true'
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run --frozen python -m ingest.warm_score_inputs
