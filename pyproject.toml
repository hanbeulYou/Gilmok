[project]
name = "gilmok-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "PublicDataReader>=1.1,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/ingest"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
